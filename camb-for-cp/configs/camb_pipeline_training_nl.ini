[runtime]
sampler = list

[list]
filename = ${LHS_SLICE_FILE}
limits = T

[output]
save_dir = ./output_nl_array
filename = ./output_nl_array/camb_nl_${SLICE_ID}
format = text
verbosity = quiet
lock = F

[pipeline]
modules = consistency camb save_pk
; Match the LHS boxes used (slices_1M_{wide,dense}/). The v2 values file
; has a narrow omega_b = [0.05, 0.06] window that rejects most 1M-LHS
; rows; values_training_1M.ini widens omega_b to [0.01, 0.20] so nothing
; is dropped by the [list] limits=T check. See HOWTO_1M.md and the
; header comment in values_training_1M.ini.
values = ./configs/values_training_1M.ini
quiet = True
debug = False
timing = True

[consistency]
file = ${COSMOSIS_STANDARD_LIBRARY}/utility/consistency/consistency_interface.py

[camb]
file = ${COSMOSIS_STANDARD_LIBRARY}/boltzmann/camb/camb_interface.py

halofit_version = takahashi

kmin = 1e-4
kmax = 50.0
nk = 506

; Nonlinear emulator: z is an input feature, not separable via D(z)^2.
; z grid 0 -> 1 in steps of 0.1 (11 slices). CAMB evaluates halofit at
; every requested z, so cost scales linearly with nz.
zmin = 0.0
zmax = 1.0
nz = 11

; Background grid stays the same as v2c -- lowering zmax_background=0
; crashes save_distances (np.geomspace(0, ...)). See AGENTS.md gotcha.
zmin_background = 0.0
zmax_background = 3.0
nz_background = 100

mode = all
power_spectra = delta_tot delta_nonu
nonlinear = pk

feedback = 0

[save_pk]
file = ./scripts/save_pk_training_nl.py
